name: Validate models

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  u4m2-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install model dependencies
        run: python -m pip install --upgrade numpy scipy numba trimesh shapely "cadquery-ocp==7.8.1.1"
      - name: Check Python syntax
        run: python -m compileall -q simulations/u4m2/backbone_20261108
      - name: Validate design and configuration JSON
        run: python scripts/validate_configs.py
      - name: Run current U4+M2 numerical tests
        working-directory: simulations/u4m2/backbone_20261108
        run: python -m unittest discover -v -p "test_*.py"
