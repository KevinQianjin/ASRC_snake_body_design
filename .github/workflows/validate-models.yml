name: Validate models

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  u4m2-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install model dependencies
        run: python -m pip install --upgrade numpy scipy numba trimesh rtree shapely networkx manifold3d vtk mapbox-earcut "cadquery-ocp==7.8.1.1"
      - name: Check Python syntax
        run: python -m compileall -q simulations/u4m2/backbone_20261108
      - name: Validate design and configuration JSON
        run: python scripts/validate_configs.py
      - name: Run current U4+M2 numerical tests
        working-directory: simulations/u4m2/backbone_20261108
        run: python -m unittest discover -v -p "test_*.py"
      - name: Check lane and guided-rope model derivatives
        working-directory: simulations/u4m2/lanes_20261113
        run: python -c "import lanes; lanes.install(guide_spacing_mm=24.); print(lanes.validate())"
      - name: Check archive coverage, fine-mesh guides and guide forces
        working-directory: simulations/u4m2/lanes_20261113
        run: python -m unittest -v test_guides
      - name: Check internal guide spacing against saved bends
        working-directory: simulations/u4m2/lanes_20261113
        run: python rope_guide_study.py results_lanes/startup_niti18_E40_p20_pre3_states.npz results_lanes/minforce_niti18_E40_p20_a456_pre3_exact_smooth1_fromstartup_tol1_states.npz length_cycle_results_lanes/nominal_states.npz closed_loop_lanes_results/payload550g_states.npz --output ../../../cad/lanes_u4m2/rope_guide_study.json
      - name: Build and check guide parts against straight M bodies
        working-directory: cad/lanes_u4m2
        run: python build_rope_guides.py
      - name: Check V2 guide mounts and exported meshes in the straight CAD
        working-directory: cad/lanes_u4m2/guides_v2
        run: python build.py --guides-only
      - name: Upload internal rope-guide screening reports
        uses: actions/upload-artifact@v4
        with:
          name: experimental-rope-guide-clearance
          path: |
            cad/lanes_u4m2/rope_guide_study.json
            cad/lanes_u4m2/rope_guide_geometry_check.json
            cad/lanes_u4m2/guides_v2/geometry_check.json
          if-no-files-found: error
